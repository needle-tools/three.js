<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - materialx drop loader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - materialx drop loader">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_loader_materialx_drop.html">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#dropZone {
				position: fixed;
				left: 16px;
				bottom: 16px;
				z-index: 10;
				padding: 12px 14px;
				border: 1px dashed rgba(0,0,0,0.35);
				background: rgba(255,255,255,0.88);
				color: #222;
				font-size: 12px;
				line-height: 1.45;
				backdrop-filter: blur(8px);
			}
			#dropFiles {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				opacity: 0;
				cursor: pointer;
			}
			#dropZone.dragover {
				border-color: #1976d2;
				background: rgba(227,242,253,0.94);
			}
			#dropStatus {
				margin-top: 4px;
				color: #666;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>MaterialX Drop Loader</span>
			</div>

			<small>
				Drop a .mtlx material, or a .glb/.gltf asset with MaterialX data.
			</small>
		</div>

		<div id="dropZone">
			<input id="dropFiles" type="file" multiple accept=".mtlx,.xml,.glb,.gltf,.png,.jpg,.jpeg,.webp,.hdr,.exr" aria-label="Load local MaterialX or glTF files">
			Drop .mtlx, .glb, or .gltf files
			<div id="dropStatus">Waiting for local files</div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
			import { MaterialXLoader } from 'three/addons/loaders/MaterialXLoader.js';

			let camera, scene, renderer, controls;
			let currentObject = null;
			const resourceUrls = [];
			const fidelityMode = new URLSearchParams( window.location.search ).has( 'fidelity' );
			const defaultEnvironmentPath = 'textures/equirectangular/san_giuseppe_bridge_2k.hdr';
			const fidelityEnvironmentName = 'san_giuseppe_bridge_split.hdr';
			const fidelityShaderballName = 'shaderball.glb';
			const fidelityBackground = new THREE.Color().setRGB( 0.5568628, 0.5568628, 0.57254905, THREE.SRGBColorSpace );

			init();

			async function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( fidelityMode ? 1 : window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = fidelityMode ? THREE.NoToneMapping : THREE.LinearToneMapping;
				renderer.toneMappingExposure = fidelityMode ? 1 : .75;
				container.appendChild( renderer.domElement );
				await renderer.init();

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 1000 );
				camera.position.set( 0, 0, 5 );

				scene = new THREE.Scene();
				scene.background = fidelityMode ? fidelityBackground : new THREE.Color( 0xbfc1c3 );

				if ( fidelityMode ) {

					window.setMaterialXFidelityBackground = ( r, g, b ) => {

						fidelityBackground.setRGB( r, g, b, THREE.SRGBColorSpace );
						scene.background = fidelityBackground;

					};

				}

				if ( ! fidelityMode ) {

					const environment = await new HDRLoader().loadAsync( defaultEnvironmentPath );
					environment.mapping = THREE.EquirectangularReflectionMapping;
					scene.environment = environment;
					scene.environmentRotation.y = - Math.PI / 2;

					const grid = new THREE.GridHelper( 20, 40, 0x7a7a7a, 0x9a9a9a );
					grid.material.transparent = true;
					grid.material.opacity = 0.45;
					scene.add( grid );

					const ambientLight = new THREE.AmbientLight( 0xffffff, 1.5 );
					scene.add( ambientLight );

					const directionalLight = new THREE.DirectionalLight( 0xffffff, 2 );
					directionalLight.position.set( 4, 8, 5 );
					scene.add( directionalLight );

				}

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 0.5;
				controls.maxDistance = 100;

				setupDropTarget();

				window.addEventListener( 'resize', onWindowResize );
				renderer.setAnimationLoop( render );

			}

			function setupDropTarget() {

				const dropZone = document.getElementById( 'dropZone' );
				const dropFiles = document.getElementById( 'dropFiles' );

				dropFiles.addEventListener( 'change', async () => {

					try {

						await handleFiles( [ ...dropFiles.files ] );
						dropFiles.value = '';

					} catch ( error ) {

						console.error( error );
						setDropStatus( `Load failed: ${ error.message }`, true );

					}

				} );

				document.addEventListener( 'dragover', ( event ) => {

					event.preventDefault();
					dropZone.classList.add( 'dragover' );

				} );

				document.addEventListener( 'dragleave', () => {

					dropZone.classList.remove( 'dragover' );

				} );

				document.addEventListener( 'drop', async ( event ) => {

					event.preventDefault();
					dropZone.classList.remove( 'dragover' );

					try {

						await handleFiles( await collectDroppedFiles( event.dataTransfer ) );

					} catch ( error ) {

						console.error( error );
						setDropStatus( `Drop failed: ${ error.message }`, true );

					}

				} );

			}

			async function collectDroppedFiles( dataTransfer ) {

				const entries = [ ...dataTransfer.items ]
					.map( ( item ) => item.webkitGetAsEntry?.() )
					.filter( Boolean );

				if ( entries.length === 0 ) return [ ...dataTransfer.files ];

				const files = [];

				for ( const entry of entries ) {

					await collectFileSystemEntry( entry, '', files );

				}

				return files;

			}

			async function collectFileSystemEntry( entry, parentPath, files ) {

				const relativePath = parentPath ? `${ parentPath }/${ entry.name }` : entry.name;

				if ( entry.isFile ) {

					const file = await new Promise( ( resolve, reject ) => entry.file( resolve, reject ) );
					Object.defineProperty( file, 'relativePath', { value: relativePath } );
					files.push( file );
					return;

				}

				if ( entry.isDirectory ) {

					const reader = entry.createReader();

					while ( true ) {

						const children = await new Promise( ( resolve, reject ) => reader.readEntries( resolve, reject ) );
						if ( children.length === 0 ) break;

						for ( const child of children ) {

							await collectFileSystemEntry( child, relativePath, files );

						}

					}

				}

			}

			async function handleFiles( files ) {

				const gltfFiles = files.filter( ( file ) => /\.(glb|gltf)$/i.test( file.name ) );
				const gltfFile = fidelityMode && files.some( ( file ) => file.name === fidelityShaderballName ) ?
					files.find( ( file ) => file.name === fidelityShaderballName ) :
					gltfFiles[ 0 ];
				const mtlxFile = files.find( ( file ) => /\.(mtlx|xml)$/i.test( file.name ) );

				if ( ! gltfFile && ! mtlxFile ) {

					setDropStatus( 'Drop .mtlx, .glb, or .gltf files', true );
					return;

				}

				setDropStatus( 'Loading dropped files...' );
				clearResourceUrls();

				const resources = createResourceMap( files );
				if ( fidelityMode ) await loadFidelityEnvironment( resources );

				if ( currentObject ) {

					scene.remove( currentObject );
					currentObject = null;

				}

				if ( gltfFile ) {

					await loadGltfWithMaterialX( gltfFile, mtlxFile, resources );

				} else {

					await loadMaterialXOnSphere( mtlxFile, resources );

				}

			}

			function createResourceMap( files ) {

				const byName = new Map();
				const byPath = new Map();
				const resources = [];

				for ( const file of files ) {

					const url = URL.createObjectURL( file );
					const relativePath = normalizeResourcePath( file.relativePath || file.webkitRelativePath || file.name );
					resourceUrls.push( url );
					if ( ! byName.has( file.name ) ) byName.set( file.name, url );
					byPath.set( relativePath, url );
					resources.push( { relativePath, url } );

				}

				const materialDirectories = resources
					.filter( ( resource ) => /\.(mtlx|xml)$/i.test( resource.relativePath ) )
					.map( ( resource ) => resource.relativePath.slice( 0, Math.max( 0, resource.relativePath.lastIndexOf( '/' ) ) ) );

				for ( const directory of materialDirectories ) {

					if ( ! directory ) continue;

					for ( const resource of resources ) {

						if ( resource.relativePath.startsWith( `${ directory }/` ) ) {

							byPath.set( resource.relativePath.slice( directory.length + 1 ), resource.url );

						}

					}

				}

				return { byName, byPath };

			}

			function normalizeResourcePath( value ) {

				return decodeURIComponent( value ).replaceAll( '\\', '/' ).replace( /^(\.\/)+/, '' );

			}

			function createLoadingManager( resources ) {

				const manager = new THREE.LoadingManager();
				manager.setURLModifier( ( url ) => {

					const resourcePath = normalizeResourcePath( url.split( /[?#]/, 1 )[ 0 ] );
					if ( resources.byPath.has( resourcePath ) ) return resources.byPath.get( resourcePath );

					const fileName = resourcePath.split( '/' ).pop();
					if ( resources.byName.has( fileName ) ) return resources.byName.get( fileName );

					return url;

				} );

				return manager;

			}

			async function loadFidelityEnvironment( resources ) {

				const url = resources.byName.get( fidelityEnvironmentName );
				if ( ! url ) return;

				const texture = await new HDRLoader( createLoadingManager( resources ) ).loadAsync( url );
				texture.mapping = THREE.EquirectangularReflectionMapping;
				scene.environment = texture;
				scene.environmentRotation.y = - Math.PI / 2;
				scene.background = fidelityBackground;

			}

			async function loadGltfWithMaterialX( file, mtlxFile, resources ) {

				const url = resources.byName.get( file.name );
				const manager = createLoadingManager( resources );
				const gltf = await new GLTFLoader( manager ).loadAsync( url );
				const gltfInfo = file.name.toLowerCase().endsWith( '.glb' ) ? parseGlb( await file.arrayBuffer() ) : null;

				if ( gltfInfo ) addEmbeddedImageResources( gltfInfo, resources );

				const model = gltf.scene;
				ensureTangents( model );

				if ( mtlxFile ) {

					const material = await createMaterialXMaterial( await mtlxFile.text(), resources );
					applyMaterialToMeshes( model, material );

				} else {

					await applyEmbeddedMaterialX( gltf, resources );

				}

				currentObject = model;
				scene.add( currentObject );
				if ( fidelityMode ) {

					configureFidelityObject( currentObject );

				} else {

					fitCameraToObject( currentObject );

				}

				await renderer.compileAsync( currentObject, camera, scene );
				setDropStatus( `Loaded ${ file.name }` );

			}

			async function loadMaterialXOnSphere( file, resources ) {

				const material = await createMaterialXMaterial( await file.text(), resources );
				const mesh = new THREE.Mesh( new THREE.SphereGeometry( 1.5, 96, 48 ), material );

				currentObject = mesh;
				scene.add( currentObject );
				if ( fidelityMode ) {

					configureFidelityCamera();

				} else {

					fitCameraToObject( currentObject );

				}

				await renderer.compileAsync( currentObject, camera, scene );
				setDropStatus( `Loaded ${ file.name }` );

			}

			async function createMaterialXMaterial( xml, resources, materialNameOrIndex = 0 ) {

				const loader = new MaterialXLoader( createLoadingManager( resources ) )
					.setTextureFlipY( true )
					.setTexCoordFlipY( false );

				const { materials } = loader.parse( xml );
				const materialList = Object.values( materials );

				if ( typeof materialNameOrIndex === 'string' && materials[ materialNameOrIndex ] ) {

					return materials[ materialNameOrIndex ];

				}

				return materialList[ materialNameOrIndex ] || materialList[ 0 ];

			}

			async function applyEmbeddedMaterialX( gltf, resources ) {

				const documents = normalizeMaterialXDocuments( gltf.parser.json.extensions?.NEEDLE_materials_mtlx );
				const materialDocuments = ( gltf.parser.json.materials || [] ).map( ( material ) => normalizeMaterialXDocuments( material.extensions?.NEEDLE_materials_mtlx ) );

				if ( documents.length === 0 && materialDocuments.every( ( materialDocs ) => materialDocs.length === 0 ) ) {

					throw new Error( 'No NEEDLE_materials_mtlx document found in glTF.' );

				}

				const materialCache = new Map();
				const assignments = [];

				gltf.scene.traverse( ( object ) => {

					if ( ! object.isMesh ) return;

					const originalMaterials = Array.isArray( object.material ) ? object.material : [ object.material ];
					const materialPromises = originalMaterials.map( ( originalMaterial ) => {

						const materialIndex = ( gltf.parser.json.materials || [] ).findIndex( ( material ) => material.name === originalMaterial?.name );
						const materialDocs = materialDocuments[ materialIndex ]?.length ? materialDocuments[ materialIndex ] : documents;
						const xml = materialDocs[ 0 ];
						const cacheKey = `${ materialIndex }:${ originalMaterial?.name || '' }`;

						if ( ! materialCache.has( cacheKey ) ) {

							materialCache.set( cacheKey, createMaterialXMaterial( xml, resources, originalMaterial?.name || materialIndex ) );

						}

						return materialCache.get( cacheKey );

					} );
					assignments.push( { object, materialPromises, isArray: Array.isArray( object.material ) } );

				} );

				for ( const assignment of assignments ) {

					const materials = await Promise.all( assignment.materialPromises );
					assignment.object.material = assignment.isArray ? materials : materials[ 0 ];

				}

			}

			function applyMaterialToMeshes( root, material ) {

				root.traverse( ( object ) => {

					if ( object.isMesh ) object.material = material;

				} );

			}

			function normalizeMaterialXDocuments( extension ) {

				if ( ! extension ) return [];

				const documents = extension.documents || extension.materials || extension;
				const result = [];

				function collect( value ) {

					if ( typeof value === 'string' && value.includes( '<materialx' ) ) {

						result.push( value );

					} else if ( Array.isArray( value ) ) {

						for ( const item of value ) collect( item );

					} else if ( value && typeof value === 'object' ) {

						for ( const item of Object.values( value ) ) collect( item );

					}

				}

				collect( documents );
				return result;

			}

			function parseGlb( arrayBuffer ) {

				const dataView = new DataView( arrayBuffer );
				if ( dataView.getUint32( 0, true ) !== 0x46546C67 ) throw new Error( 'Invalid GLB header.' );

				const jsonLength = dataView.getUint32( 12, true );
				const jsonType = dataView.getUint32( 16, true );
				if ( jsonType !== 0x4E4F534A ) throw new Error( 'GLB JSON chunk is missing.' );

				const json = JSON.parse( new TextDecoder().decode( new Uint8Array( arrayBuffer, 20, jsonLength ) ) );
				let offset = 20 + jsonLength;
				while ( offset % 4 !== 0 ) offset ++;

				const bodyLength = dataView.getUint32( offset, true );
				const bodyType = dataView.getUint32( offset + 4, true );
				const body = bodyType === 0x004E4942 ? new Uint8Array( arrayBuffer, offset + 8, bodyLength ) : null;

				return { json, body };

			}

			function resolveJsonPointer( root, pointer ) {

				if ( pointer === '' ) return root;
				if ( typeof pointer !== 'string' || ! pointer.startsWith( '/' ) ) return undefined;

				return pointer.slice( 1 ).split( '/' ).reduce( ( value, token ) => {

					if ( value === undefined || value === null ) return undefined;
					return value[ token.replaceAll( '~1', '/' ).replaceAll( '~0', '~' ) ];

				}, root );

			}

			function addEmbeddedImageResources( gltfInfo, resources ) {

				const imageUrls = new Map();

				for ( const [ imageIndex, image ] of ( gltfInfo.json.images || [] ).entries() ) {

					if ( image.uri || image.bufferView === undefined ) continue;

					const bufferView = gltfInfo.json.bufferViews[ image.bufferView ];
					const byteOffset = bufferView.byteOffset || 0;
					const byteLength = bufferView.byteLength || 0;
					const blob = new Blob( [ gltfInfo.body.slice( byteOffset, byteOffset + byteLength ) ], { type: image.mimeType || 'application/octet-stream' } );
					const url = URL.createObjectURL( blob );

					resourceUrls.push( url );
					imageUrls.set( imageIndex, url );
					if ( image.name ) {

						resources.byName.set( image.name, url );
						resources.byPath.set( image.name, url );

					}

				}

				const materialXDocuments = gltfInfo.json.extensions?.NEEDLE_materials_mtlx?.documents || [];

				for ( const document of materialXDocuments ) {

					for ( const textureReference of document.textures || [] ) {

						if ( ! textureReference.name ) continue;

						const texture = resolveJsonPointer( gltfInfo.json, textureReference.pointer );
						const url = texture ? imageUrls.get( texture.source ) : undefined;
						if ( ! url ) continue;

						resources.byName.set( textureReference.name, url );
						resources.byPath.set( textureReference.name, url );

					}

				}

			}

			function ensureTangents( root ) {

				root.traverse( ( object ) => {

					if ( ! object.isMesh ) return;

					const geometry = object.geometry;
					if ( geometry.index && geometry.attributes.uv && geometry.attributes.normal && ! geometry.attributes.tangent ) {

						geometry.computeTangents();

					}

				} );

			}

			function configureFidelityObject( object ) {

				object.position.set( - 0.060197055, - 1.1499996, 0.0707755 );
				object.quaternion.identity();
				object.scale.setScalar( 1.0974735 );
				configureFidelityCamera();

			}

			function configureFidelityCamera() {

				camera.position.set( 0, 0, 5 );
				camera.quaternion.identity();
				camera.near = 0.3;
				camera.far = 1000;
				camera.fov = 45;
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				controls.target.set( 0, 0, 0 );
				controls.update();

			}

			function fitCameraToObject( object ) {

				const box = new THREE.Box3().setFromObject( object );
				const size = box.getSize( new THREE.Vector3() );
				const center = box.getCenter( new THREE.Vector3() );
				const maxSize = Math.max( size.x, size.y, size.z ) || 1;
				const distance = maxSize / ( 2 * Math.tan( THREE.MathUtils.degToRad( camera.fov ) / 2 ) );

				camera.position.copy( center ).add( new THREE.Vector3( distance * 0.35, distance * 0.25, distance * 1.4 ) );
				camera.near = Math.max( distance / 100, 0.01 );
				camera.far = Math.max( distance * 100, 100 );
				camera.updateProjectionMatrix();

				controls.target.copy( center );
				controls.update();

			}

			function clearResourceUrls() {

				for ( const url of resourceUrls ) URL.revokeObjectURL( url );
				resourceUrls.length = 0;

			}

			function setDropStatus( message, isError = false ) {

				const dropStatus = document.getElementById( 'dropStatus' );
				dropStatus.textContent = message;
				dropStatus.style.color = isError ? '#c62828' : '#666';

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function render() {

				controls.update();
				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>

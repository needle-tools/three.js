name: Needle Pages Setup

on:
  push:
    branches:
      - needle-github-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: needle-github-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure CNAME exists
        run: echo "three.needle.tools" > CNAME

      - name: Ensure .nojekyll exists
        run: touch .nojekyll

      - name: Commit files if missing
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CNAME .nojekyll
          if git diff --staged --quiet; then
            echo "Files already exist in repository"
          else
            git commit -m "Add CNAME and .nojekyll files"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
